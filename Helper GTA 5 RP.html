<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Помощник GTA 5 RP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: одна колонка до 560px, липкая шапка с итогами дня, нижняя панель из пяти вкладок. */
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --surface2:#E8EAF2; --line:#D3D7E3;
  --fg:#161A2A; --muted:#5B6379;
  --accent:#8F5700; --accent-bg:#F2B33D; --on-accent:#1B1304;
  --good:#16784B; --bad:#B3261E;
  --c-easy:#1E9E5A; --c-mid:#C77A0A; --c-coop:#2F6FE0; --c-skip:#7B8299; --c-fac:#D4700F;
  --f-display:'Unbounded','Arial Black',sans-serif;
  --f-body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1020; --surface:#161A2E; --surface2:#1F2442; --line:#2A3050;
    --fg:#E8EAF4; --muted:#8F97B4;
    --accent:#F2B33D; --accent-bg:#F2B33D; --on-accent:#1B1304;
    --good:#4CC38A; --bad:#FF7070;
    --c-easy:#3DCB7F; --c-mid:#F0A030; --c-coop:#5B93FF; --c-skip:#8A91A8; --c-fac:#F58A24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1020; --surface:#161A2E; --surface2:#1F2442; --line:#2A3050;
  --fg:#E8EAF4; --muted:#8F97B4;
  --accent:#F2B33D; --accent-bg:#F2B33D; --on-accent:#1B1304;
  --good:#4CC38A; --bad:#FF7070;
  --c-easy:#3DCB7F; --c-mid:#F0A030; --c-coop:#5B93FF; --c-skip:#8A91A8; --c-fac:#F58A24;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-block:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:560px;margin:0 auto;padding-bottom:92px}
.app.wide{max-width:1120px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.plate{font-family:var(--f-display);font-weight:700;font-size:11px;letter-spacing:.06em;background:var(--accent-bg);color:var(--on-accent);padding:5px 7px;border-radius:3px;border:2px solid var(--on-accent);flex:none}
h1{font-family:var(--f-display);font-weight:500;font-size:14px;margin:0;flex:1;min-width:0;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.stat span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-family:var(--f-mono);font-size:16px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}

h2{font-family:var(--f-display);font-weight:500;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.stack{display:grid;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0}
.card.done{border-color:var(--good)}
.rowtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.meta{font-size:12.5px;color:var(--muted)}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:1px 5px;margin-left:8px;vertical-align:middle}
.badge{font-size:11px;font-weight:600;color:var(--accent);background:var(--surface2);border-radius:3px;padding:2px 7px;white-space:nowrap}
.badge.good{color:var(--good)}
.time{font-family:var(--f-mono);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums;margin:6px 0 8px}
.bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent-bg);transition:width 1s linear}
.card.done .bar i{background:var(--good)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.actions .grow{flex:1}

.btn{min-height:42px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);font-weight:600;cursor:pointer}
.btn.pri{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--on-accent)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn.del{color:var(--bad);background:transparent}

.form{display:grid;gap:8px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
input,select,textarea{width:100%;min-height:42px;font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0}
textarea{min-height:84px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--fg)}
.check input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--accent-bg)}

.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:14px;font-size:13px}
.note{font-size:12.5px;color:var(--muted);margin:10px 0 0}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:104px}
.col{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:4px;text-align:center;font-size:11px;color:var(--muted)}
.track{display:flex;align-items:flex-end;min-height:0}
.track i{display:block;width:100%;height:var(--h);min-height:2px;background:var(--accent-bg);border-radius:2px 2px 0 0}
.col.today{color:var(--fg);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:10px}
.kpi b{display:block;font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--muted)}

.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pair{display:flex;gap:14px;flex-wrap:wrap;margin-top:4px;font-size:13px}
.rank{font-family:var(--f-display);font-size:12px;color:var(--muted);margin-right:8px}
.score{margin-top:8px}

.tbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:12px}
.tctl{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;min-width:0}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--fg);cursor:pointer}
.chk input,.tl input{appearance:none;-webkit-appearance:none;width:18px;height:18px;min-height:0;flex:none;margin:0;border:2px solid var(--muted);border-radius:3px;background:transparent;display:grid;place-content:center;cursor:pointer;padding:0}
.chk input:checked,.tl input:checked{background:var(--good);border-color:var(--good)}
.chk input:checked::after,.tl input:checked::after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.reset{border-color:var(--bad);color:var(--bad);background:transparent}
.online{display:flex;align-items:center;gap:8px;border:1px solid var(--accent-bg);border-radius:6px;padding:4px 8px;font-size:13px}
.step{width:28px;height:28px;border-radius:5px;border:1px solid var(--accent-bg);background:transparent;color:var(--accent);font-weight:700;font-size:16px;line-height:1;cursor:pointer;padding:0}
.hrs{color:var(--accent);font-weight:700;min-width:30px;text-align:center}
.pill{background:var(--surface2);border:1px solid var(--accent-bg);color:var(--accent);border-radius:5px;padding:2px 8px;font-weight:700;font-size:12px;white-space:nowrap}
.tsum{display:flex;gap:16px}
.tsum div{display:grid;gap:2px;text-align:right}
.tsum div+div{border-left:1px solid var(--line);padding-left:16px}
.tsum span{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.tsum b{font-size:19px}
.tsum b.g{color:var(--good)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px;align-items:start}
.cat{border:1px solid var(--cat);border-radius:8px;background:var(--surface);overflow:hidden;min-width:0}
.chead{width:100%;display:flex;align-items:center;gap:8px;padding:11px 12px;border:0;background:var(--surface2);background:color-mix(in srgb,var(--cat) 14%,var(--surface));cursor:pointer;text-align:left;font-weight:700;min-height:44px}
.cn{flex:none}
.caret{width:0;height:0;border:4px solid transparent;border-top-width:0;border-bottom-color:currentColor}
.chead[aria-expanded="false"] .caret{border-top-width:4px;border-bottom-width:0;border-top-color:currentColor;border-bottom-color:transparent}
.ce{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--muted)}
.ce.on{color:var(--cat)}
.chead .caret:last-child{margin-left:auto}
.trow{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.tl{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 18px 52px;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;font-size:13.5px;min-height:44px}
.tt{overflow-wrap:anywhere}
.rew{font-size:12px;font-weight:700;color:var(--muted);text-align:right}
.trow.on{background:var(--surface2);background:color-mix(in srgb,var(--cat) 15%,var(--surface))}
.trow.on .tt{text-decoration:line-through;color:var(--muted)}
.trow.on .rew{color:var(--good)}
.hb{min-width:74px;padding:0 8px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.trow.off .tl{opacity:.45}
.trow.off .tt{font-style:italic}
.x{width:44px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--bad);font-size:20px;cursor:pointer}
.tempty{padding:12px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.tadd{display:grid;grid-template-columns:minmax(0,1fr) 64px auto;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.tadd input{min-height:38px}
.rules{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.rules summary{cursor:pointer;font-weight:600;font-size:13.5px}
.rules .fields{margin-top:10px;max-width:420px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:38px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:600;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--on-accent)}
.chartcard{padding:14px 12px 12px}
.chart{position:relative;height:210px;margin:8px 0 0 34px}
.gl{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line)}
.gl span{position:absolute;right:calc(100% + 6px);top:-8px;font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.avgl{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--fg);opacity:.55;z-index:2;pointer-events:none}
.bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:calc(40px/var(--n) + 2px);z-index:1}
.bcol{position:relative;border:0;background:transparent;padding:0;cursor:pointer;min-width:0;height:100%}
.bcol i{position:absolute;left:0;right:0;bottom:0;height:var(--h);min-height:3px;background:var(--accent-bg);border-radius:3px 3px 0 0;opacity:.6}
.bcol.sel i{opacity:1}
.bcol.none i{background:var(--line);opacity:1;height:3px}
.bcol .val{position:absolute;left:-6px;right:-6px;bottom:calc(var(--h) + 3px);text-align:center;font-size:10.5px;font-weight:700;font-family:var(--f-mono);color:var(--muted)}
.bcol.sel .val{color:var(--fg)}
.bcol.none .val{display:none}
.many .bcol .val{display:none}
.many .bcol.sel .val{display:block}
.xl{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:calc(40px/var(--n) + 2px);margin:6px 0 0 34px;font-size:10.5px;color:var(--muted);text-align:center;line-height:1.25}
.xl span{min-width:0;white-space:nowrap}
.xl .td{color:var(--fg);font-weight:700}
.detail{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px}

ol.route{margin:8px 0 0;padding-left:22px;display:grid;gap:3px}
.notebody{white-space:pre-wrap;margin:6px 0 0;overflow-wrap:anywhere}
.empty{padding:18px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:6px;font-size:13.5px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs div{max-width:560px;margin:0 auto;display:flex}
.tab{flex:1;min-width:0;display:grid;justify-items:center;gap:2px;background:none;border:0;color:var(--muted);font-size:10.5px;padding:5px 0;min-height:48px;cursor:pointer}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
#theme{width:38px;height:38px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;padding:0}
#theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:6px;font-size:13.5px;font-weight:500;z-index:20;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .15s}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.bar i,#toast{transition:none}}
</style>

<script>
(function(){
'use strict';
var KEY='gta5rp-helper-v1', THEME_KEY='gta5rp-helper-theme';
var H=3600000, D=86400000;
var $=function(s){return document.querySelector(s);};
var uid=function(){return Math.random().toString(36).slice(2,9);};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0;}
function money(n){return '$'+Math.round(n).toLocaleString('ru-RU');}
function fmtN(n){return (Math.round(n*10)/10).toLocaleString('ru-RU');}
function pad(n){return n<10?'0'+n:''+n;}
function sum(a,k){return a.reduce(function(s,x){return s+(x[k]||0);},0);}
function fmtDur(ms){
  if(ms<=0)return '00:00';
  var s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),c=s%60;
  if(d>0)return d+'д '+h+'ч '+pad(m)+'м';
  if(h>0)return h+':'+pad(m)+':'+pad(c);
  return pad(m)+':'+pad(c);
}
function fmtDate(ts){return new Date(ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function startOfDay(ts){var d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();}
function dayKey(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

/* Игровой день начинается в 07:00 по Москве (UTC+3, это 04:00 UTC). */
function gameIdx(ts){return Math.floor(((ts==null?Date.now():ts)-4*H)/D);}
function idxDate(i){return new Date(i*D).toISOString().slice(0,10);}
function nextReset(){return (gameIdx()+1)*D+4*H;}
function fmtDay(d){return new Date(d+'T12:00:00Z').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});}
function dayWord(n){var a=n%100,b=n%10;return a>10&&a<20?'дней':b===1?'день':b>1&&b<5?'дня':'дней';}
function rollover(){
  var cur=gameIdx();
  if(state.gameDay===cur)return false;
  if(state.gameDay<cur){
    var T=taskTotals(),d=idxDate(state.gameDay);
    var done=state.tasks.filter(function(t){return t.done&&!t.hidden&&!OPTIONAL[t.cat];}).length;
    state.history=state.history.filter(function(h){return h.d!==d;});
    state.history.push({d:d,bp:T.earned,done:done,mult:T.mult});
    state.history.sort(function(a,b){return a.d<b.d?-1:1;});
    if(state.history.length>400)state.history=state.history.slice(-400);
    state.tasks.forEach(function(t){t.done=false;});
    
  }
  state.gameDay=cur;save();return true;
}
var OPTIONAL={fac:true};
function makeTasks(){

function normalize(s){
  var fresh=seed(),st=Object.assign(seed(),s);
  if(!s.ver||s.ver<2){st.tasks=fresh.tasks;st.cats=fresh.cats;st.tab='tasks';st.ver=2;}
  if(st.ver<3){
    if(!st.tasks.some(function(t){return t.cat==='fac';})){fresh.tasks.filter(function(t){return t.cat==='fac';}).forEach(function(t){st.tasks.push(t);});}
    st.cats.forEach(function(c){if(c.id==='fac')c.open=true;});
    st.ver=3;
  }
  if(st.ver<4){
    st.gameDay=gameIdx();
    if(!Array.isArray(st.history))st.history=[];
    st.ver=4;
  }
  return st;
}

}

}

function beep(){
  if(!state.sound||!actx)return;
  try{
    [0,0.28,0.56].forEach(function(t){
      var o=actx.createOscillator(),g=actx.createGain(),at=actx.currentTime+t;
      o.frequency.value=880;
      g.gain.setValueAtTime(0.0001,at);
      g.gain.exponentialRampToValueAtTime(0.25,at+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,at+0.2);
      o.connect(g);g.connect(actx.destination);o.start(at);o.stop(at+0.22);
    });
  }catch(e){}
}

function taskTotals(){

}

}

var selDay=null;
function niceMax(m){
  var st=[1,2,5,10,20,25,50,100,200,250,500,1000,2000,5000,10000];
  for(var i=0;i<st.length;i++)if(m/st[i]<=4)return {step:st[i],max:Math.max(1,Math.ceil(m/st[i]))*st[i]};
  return {step:20000,max:Math.ceil(m/20000)*20000};
}

  var best=have.reduce(function(m,x){return !m||x.bp>m.bp?x:m;},null);

    '<div class="xl" style="--n:'+N+'">'+xl+'</div></div>'+
    '<div class="detail">'+det+'</div></div>'+
    '<p class="note">Игровой день идёт с 07:00 до 07:00 по Москве. Нажми на столбец, чтобы увидеть день. Пунктир показывает среднее за прошлые дни. '+(past.length?'':'Прошлые дни появятся после первого сброса в 07:00. ')+'Фракционные задания в BP не входят.</p>'+
    '<h2>Резервная копия</h2><div class="card form"><textarea id="backup" aria-label="Данные приложения" placeholder="Нажми «Выгрузить», скопируй текст и сохрани в заметках телефона. Чтобы вернуть данные, вставь текст сюда и нажми «Загрузить»."></textarea>'+
    '<div class="actions" style="margin-top:0"><button class="btn sm" type="button" data-act="export">Выгрузить</button><button class="btn sm" type="button" data-act="import">Загрузить</button></div>'+
    '<p class="note">Данные и история хранятся в этом браузере. Если очистить данные Safari, они пропадут, поэтому иногда делай копию.</p></div>';
}

var VIEWS={timers:viewTimers,tasks:viewTasks,stats:viewStats};
function render(){
  if(!VIEWS[state.tab])state.tab='tasks';
  $('#view').innerHTML=VIEWS[state.tab]();
  document.querySelectorAll('.tab').forEach(function(b){
    if(b.dataset.id===state.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  renderStats();
  $('#stats').hidden=state.tab==='tasks';
  $('.app').classList.toggle('wide',state.tab==='tasks');
}

/* ---------- actions ---------- */
function byId(arr,id){for(var i=0;i<arr.length;i++)if(arr[i].id===id)return arr[i];return null;}
function remove(key,id){state[key]=state[key].filter(function(x){return x.id!==id;});save();render();toast('Удалено');}
var resetArmed=false,resetT=null;
var ACTS={
  'theme':function(){toggleTheme();},
  'tab':function(id){state.tab=id;save();render();window.scrollTo(0,0);},
  'timer-start':function(id){var t=byId(state.timers,id);if(!t)return;t.endsAt=Date.now()+t.min*60000;t.fired=false;save();render();},
  'timer-reset':function(id){var t=byId(state.timers,id);if(!t)return;t.endsAt=null;t.fired=false;save();render();},
  'timer-del':function(id){remove('timers',id);},
  'event-del':function(id){remove('events',id);},
  'stat-sel':function(id){selDay=id;render();},
  'stat-range':function(id){state.statRange=+id;save();render();},
  'cat-toggle':function(id){var c=byId(state.cats,id);if(!c)return;c.open=!c.open;save();render();},
  'edit-toggle':function(){state.edit=!state.edit;save();render();},
  'tasks-reset':function(){
    if(!resetArmed){
      resetArmed=true;clearTimeout(resetT);
      resetT=setTimeout(function(){resetArmed=false;if(state.tab==='tasks')render();},3000);
      render();return;
    }
    resetArmed=false;clearTimeout(resetT);
    state.tasks.forEach(function(t){t.done=false;});save();render();toast('Всё сброшено');
  },
  'task-hide':function(id){var t=byId(state.tasks,id);if(!t)return;t.hidden=!t.hidden;save();render();},
  'task-del':function(id){remove('tasks',id);},
  'clear-ex':function(){
    ['timers','events'].forEach(function(k){state[k]=state[k].filter(function(x){return !x.ex;});});
    save();render();toast('Примеры убраны');
  },
  'export':function(){
    var ta=$('#backup');ta.value=JSON.stringify(state);ta.focus();ta.select();
    try{
      navigator.clipboard.writeText(ta.value).then(function(){toast('Скопировано');},function(){toast('Текст выделен, скопируй его вручную');});
    }catch(e){toast('Текст выделен, скопируй его вручную');}
  },
  'import':function(){
    try{
      var s=JSON.parse($('#backup').value);
      if(!s||!Array.isArray(s.timers)||!Array.isArray(s.earnings))throw new Error('bad');
      state=normalize(s);save();render();toast('Данные загружены');
    }catch(e){toast('Не удалось прочитать данные');}
  }
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var f=ACTS[el.dataset.act];
  if(f)f(el.dataset.id);
});

var FORMS={
  timer:function(d){
    var min=num(d.min);if(min<=0)return 'Укажи, сколько минут идёт таймер';
    state.timers.push({id:uid(),name:(d.name||'').trim()||'Таймер',min:min,endsAt:null,fired:false});return 'Таймер добавлен';
  },
  event:function(d){
    var at=new Date(d.at).getTime();if(!isFinite(at))return 'Укажи дату и время';
    state.events.push({id:uid(),name:(d.name||'').trim()||'Событие',at:at,fired:at<=Date.now()});return 'Событие добавлено';
  },
  task:function(d){
    var text=(d.text||'').trim();if(!text)return 'Опиши задание';
    var cat=state.cats.some(function(c){return c.id===d.cat;})?d.cat:'easy';
    state.tasks.push({id:uid(),cat:cat,text:text,reward:Math.max(0,num(d.reward)),done:false});return 'Задание добавлено';
  }
};
var OK={'Таймер добавлен':1,'Событие добавлено':1,'Задание добавлено':1};
document.addEventListener('submit',function(e){
  var f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  var h=FORMS[f.dataset.form];if(!h)return;
  var msg=h(Object.fromEntries(new FormData(f)));
  if(OK[msg]){save();render();}
  toast(msg);
});
document.addEventListener('change',function(e){
  if(e.target.id==='sound'){state.sound=e.target.checked;save();if(state.sound)unlock();}
  if(e.target.id==='vip'){state.vip=e.target.checked;save();render();}
  if(e.target.id==='x2'){state.x2=e.target.checked;save();render();}
  if(e.target.dataset&&e.target.dataset.task){var tk=byId(state.tasks,e.target.dataset.task);if(tk){tk.done=e.target.checked;save();render();}}
});
document.addEventListener('toggle',function(e){if(e.target&&e.target.id==='rules'){state.rulesOpen=e.target.open;save();}},true);

/* ---------- clock ---------- */
function tick(){
  var now=Date.now(),changed=false;
  if(rollover()){changed=true;toast('Новый день: отметки сброшены, итог прошлого дня сохранён');}
  state.timers.forEach(function(t){if(t.endsAt&&!t.fired&&t.endsAt<=now){t.fired=true;changed=true;beep();}});
  state.events.forEach(function(ev){if(!ev.fired&&ev.at<=now){ev.fired=true;changed=true;beep();}});
  if(changed){save();render();return;}
  document.querySelectorAll('[data-left]').forEach(function(el){el.textContent=fmtDur(+el.dataset.end-now);});
  document.querySelectorAll('[data-bar]').forEach(function(el){
    var left=+el.dataset.end-now,total=+el.dataset.total;
    el.style.width=Math.max(0,Math.min(100,100-left/total*100))+'%';
  });
}
var rolled=rollover();
render();
if(rolled)setTimeout(function(){toast('Новый день: отметки сброшены, итог прошлого дня сохранён');},400);
setInterval(tick,1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick();});
})();
</script>

</body></html>
